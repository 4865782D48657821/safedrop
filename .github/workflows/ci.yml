name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  laravel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Check flake
        run: nix flake check path:.

      - name: Install PHP dependencies
        run: nix develop path:. --command composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          nix develop path:. --command php artisan key:generate --ansi
          nix develop path:. --command php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"

      - name: Run migrations
        run: nix develop path:. --command php artisan migrate --force --ansi

      - name: Check formatting
        run: nix develop path:. --command composer run format -- --test

      - name: Run tests
        run: nix develop path:. --command composer run test
